name: CI

# push(main)と全プルリクエストで、ビルド＋ユニットテストを自動実行する。
# E2E（VoicePasteE2E）は実Groq APIキーと日本語TTS音声（Kyoko）が必要なためCIに含めない（SPEC.md参照）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & unit tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: ビルドキャッシュを復元
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: ビルド
        run: swift build

      - name: ユニットテスト実行（136ケース・XCTest非依存ランナー）
        run: swift run VoicePasteTests
